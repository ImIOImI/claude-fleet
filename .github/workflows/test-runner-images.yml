      - 'src/main/state/rawCodec.ts'
      - 'src/main/state/serialQueue.ts'
      - 'src/main/state/transcriptPaths.ts'
      - 'src/main/inbox/inboxDb.ts'
      - 'src/main/inbox/inboxCore.ts'
      - 'src/main/inbox/inboxService.ts'
      - 'src/main/inbox/inboxPolicy.ts'
      - 'src/main/inbox/notifyService.ts'
      - 'src/main/inbox/notifyStore.ts'
      - 'src/main/inbox/notifyPolicy.ts'
