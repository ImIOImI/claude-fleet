name: build-app

# Builds the desktop app for macOS, Windows, and Linux on native runners
# (so native modules compile / fetch prebuilds without cross-compile hacks).
# - PRs and manual runs: build + upload artifacts for inspection.
# - Version tags (v*):   build, then publish a DRAFT GitHub Release with the
#                        installers attached. Binaries are UNSIGNED.

# Path filtering deliberately does NOT live in `on.pull_request.paths` (#303).
# A workflow skipped by a path filter never creates its check runs at all, so
# the `e2e (playwright)` / `e2e (playwright, windows)` contexts the `pass ci`
# ruleset requires stayed Pending forever and docker/docs-only PRs could never
# merge. This workflow therefore runs on EVERY pull request, and the filtering
# happens in the `changes` job below — see the aggregator jobs at the bottom
# for how the required contexts always report.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Which parts of the tree changed. Everything expensive keys off this instead
  # of a workflow-level path filter. Fails SAFE: anything we can't determine
  # (non-PR event, missing merge base) runs the full pipeline.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need both PR endpoints to diff against the merge base

      - name: Detect code changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "non-PR event (${{ github.event_name }}) — building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head='${{ github.event.pull_request.head.sha }}'
          base=$(git merge-base '${{ github.event.pull_request.base.sha }}' "$head" 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "no merge base found — building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Mirrors the old on.pull_request.paths list.
          if echo "$changed" | grep -qE '^(src/|tests/|playwright\.config\.ts$|package\.json$|package-lock\.json$|electron-builder\.yml$|electron\.vite\.config\.ts$|\.github/workflows/build-app\.yml$)'; then
            echo "→ code paths touched; running the full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ no code paths touched; skipping build/e2e"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: 'dist/*.dmg'
          - os: windows-latest
            artifact_glob: 'dist/*.exe'
          - os: ubuntu-latest
            artifact_glob: 'dist/*.AppImage'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # keytar's prebuilt binary dynamically links libsecret at runtime;
      # node-pty compiles from source on Linux (no bundled linux prebuild).
      - name: Install Linux build/runtime deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-1-dev

      # macOS/Linux: install without scripts, drop the optional cpu-features
      # dep, then rebuild the required natives for the Electron ABI. We must
      # exclude cpu-features (an unused optional ssh2/dockerode transitive):
      # it builds via the old `nan`, whose `v8::External::Value()` was removed
      # in Electron 43's V8, so its node-gyp build fails on every platform.
      - name: Install dependencies (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          npm ci --ignore-scripts
          rm -rf node_modules/cpu-features
          npx --no-install electron-builder install-app-deps

      # Windows: never compile native modules from source. node-gyp can't
      # detect the runner's newest Visual Studio, and we don't need node-ABI
      # builds — only Electron-ABI ones. Mirror the Makefile's win path:
      #   --ignore-scripts (skip the node-ABI build during install)
      #   drop cpu-features (optional ssh2 dep, no win prebuild → needs MSVC)
      #   install-app-deps fetches better-sqlite3/keytar Electron prebuilts;
      #   node-pty uses its bundled win32 prebuild.
      - name: Install dependencies (Windows — prebuilt natives, no MSVC)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          npm ci --ignore-scripts
          rm -rf node_modules/cpu-features
          npx --no-install electron-builder install-app-deps --platform win32 --arch x64

      - name: Build installer
        # --publish never: the release job (below) owns publishing.
        # CSC_IDENTITY_AUTO_DISCOVERY=false: don't try to sign on macOS — these
        # are unsigned builds; a stray keychain identity must not break the run.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-fleet-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # Playwright end-to-end suite (tests/*.spec.ts). These drive the REAL Electron
  # app via @playwright/test's _electron.launch, so the job needs a virtual
  # display (Xvfb) and Chromium/Electron's shared libraries — neither of which
  # the lean runner image has, which is why e2e runs here on a GH runner rather
  # than in a container. No spec spawns a Docker container (mock fleet or
  # on-disk seed data), so no Docker daemon is required. Linux-only for now:
  # Xvfb is Linux-only, and one GH-hosted Linux runner covers the suite.
  e2e-linux:
    name: e2e run (playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # libsecret for keytar (links it at runtime); build-essential/python3 are
      # preinstalled on the runner and let node-pty compile its Electron-ABI build.
      - name: Install Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-1-dev

      # Install without scripts, drop the optional cpu-features dep (its old
      # `nan` build fails against Electron 43's V8), then rebuild the required
      # natives against Electron's ABI — exactly what we launch below.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          rm -rf node_modules/cpu-features
          npx --no-install electron-builder install-app-deps

      # apt-installs the Chromium/Electron shared libs (libgtk-3, libnss3,
      # libgbm, libasound, …) — the set Electron needs to start.
      - name: Install Electron/Chromium system libraries
        run: npx playwright install-deps chromium

      - name: Build app
        run: npm run build

      # Xvfb gives Electron a headless display; ELECTRON_DISABLE_SANDBOX avoids
      # Chromium's setuid-sandbox requirement (unavailable in CI).
      - name: Run Playwright e2e
        run: xvfb-run -a npm run test:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  # Windows Playwright e2e suite. Runs the same specs as the Linux e2e job but
  # on windows-latest, so the Windows-only runtime paths get real coverage:
  # node-pty spawns via ConPTY (local-backend.spec.ts) and the MCP transport is
  # loopback TCP + per-workspace token instead of a Unix socket (connectMcp in
  # _helpers.ts picks the transport by platform). Electron needs no Xvfb on
  # Windows — it opens a native window. No spec spawns a real Docker container
  # (mock fleet + on-disk seed data), but the app still pokes the Docker engine
  # on startup (sessions:list → dockerode), and the windows-latest daemon is not
  # reliably running when the job begins — so a "Wait for the Docker engine"
  # step gates the run to avoid an intermittent `ENOENT //./pipe/docker_engine`
  # flake (#243).
  e2e-windows-run:
    name: e2e run (playwright, windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # WSL seeding + Electron e2e normally fit in ~15 min; bound runaway hangs
    # (a wedged wsl.exe blocks synchronously, outside Playwright's timeouts).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Same Windows install dance as the build job: skip node-ABI native builds,
      # then re-run only the electron binary download (skipped by --ignore-scripts),
      # then fetch Electron-ABI prebuilts (better-sqlite3, keytar, node-pty).
      - name: Install dependencies (prebuilt natives, no MSVC)
        shell: bash
        run: |
          npm ci --ignore-scripts
          rm -rf node_modules/cpu-features
          node node_modules/electron/install.js
          npx --no-install electron-builder install-app-deps --platform win32 --arch x64

      - name: Install Electron/Chromium system libraries
        run: npx playwright install-deps chromium

      - name: Build app
        run: npm run build

      # windows-latest ships Docker, but the daemon service isn't guaranteed to
      # be running (or done starting) when the job begins — an intermittent
      # `connect ENOENT //./pipe/docker_engine` then fails the e2e specs, which
      # poke dockerode on startup via sessions:list even though none of them
      # spawn a container (#243). Start the service if it's stopped and poll the
      # engine until it answers (or fail loudly after 3 min) BEFORE the specs run,
      # so a slow-starting daemon no longer surfaces as a cryptic mid-test flake.
      - name: Wait for the Docker engine
        shell: pwsh
        run: |
          Get-Service -Name 'docker*' -ErrorAction SilentlyContinue |
            Where-Object { $_.Status -ne 'Running' } |
            ForEach-Object { Write-Host "Starting service $($_.Name)"; Start-Service $_.Name }
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { Write-Host 'Docker engine is ready.'; exit 0 }
            Write-Host 'Waiting for the Docker engine...'
            Start-Sleep -Seconds 3
          }
          Write-Error 'Docker engine did not become ready within 3 minutes.'
          exit 1

      # WSL distro for the wsl-local e2e specs (#253). setup-wsl handles the
      # no-reboot install. Debian, not Alpine: Alpine's download URL is resolved
      # via an unauthenticated GitHub API lookup that 403s on shared runner IPs
      # (observed on PR #257's first run); Debian comes from Microsoft's static
      # aka.ms link. WSL *1*, deliberately: WSL2's VM + nested-virt boot took
      # ~21 min on a hosted runner and destabilized it (PR #257 second run).
      # WSL1 installs in ~2 min with no VM and covers everything the spec
      # exercises (list/probe/login-shell spawn/interop/\\wsl.localhost/
      # signals; the transcript watcher polls either way). Real WSL2 coverage
      # is manual on dev machines. Specs self-skip if no distro lands.
      - name: Set up WSL
        uses: Vampire/setup-wsl@v5
        continue-on-error: true   # WSL flakiness must not fail unrelated e2e
        with:
          distribution: Debian
          wsl-version: 1

      # continue-on-error above can hide a failed install behind a green check
      # while wsl-local.spec.ts silently self-skips — surface that as a loud
      # annotation so "passed CI" can't be mistaken for "WSL flow tested".
      - name: Check WSL availability (wsl-local specs skip without it)
        shell: pwsh
        run: |
          $distros = (wsl.exe --list --quiet) -join ''
          if (-not $distros.Trim()) {
            Write-Host "::warning title=WSL e2e skipped::No WSL distro installed - tests/wsl-local.spec.ts will self-skip; the WSL launcher flow is NOT covered by this run."
          } else {
            Write-Host "WSL distros present:"; wsl.exe --list --verbose
          }

      # No Xvfb on Windows — Electron opens a native window. ELECTRON_DISABLE_SANDBOX
      # avoids the Chromium setuid-sandbox requirement (same as Linux e2e).
      - name: Run Playwright e2e
        run: npm run test:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-windows
          path: test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Required-context aggregators (#303).
  #
  # These two carry the EXACT names the `pass ci` ruleset requires, run on every
  # PR (`if: always()`), and simply mirror the real run's outcome. That gives a
  # docker/docs-only PR a green required check in ~10 s instead of a permanent
  # Pending, without weakening the gate: a genuine e2e failure still fails here.
  #
  # Why not the no-op twin workflow with `paths-ignore`: `paths` and
  # `paths-ignore` are not complements, so a PR touching BOTH code and docs
  # matches both filters and produces two check runs with the same name — the
  # no-op passing in seconds while the real suite is still running. Keeping one
  # job per required name avoids that ambiguity entirely.
  #
  # `changes` is checked explicitly: if IT fails, the run job is skipped, and
  # treating that skip as success would silently green a broken pipeline.
  e2e:
    name: e2e (playwright)
    needs: [changes, e2e-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the e2e run outcome
        shell: bash
        run: |
          gate='${{ needs.changes.result }}'
          run='${{ needs.e2e-linux.result }}'
          echo "changes=$gate  e2e run=$run"
          if [ "$gate" != "success" ]; then
            echo "::error::the changes gate concluded '$gate'"; exit 1
          fi
          case "$run" in
            success) echo "e2e passed"; exit 0 ;;
            skipped) echo "no code paths changed — e2e not required for this PR"; exit 0 ;;
            *) echo "::error::e2e run concluded '$run'"; exit 1 ;;
          esac

  e2e-windows:
    name: e2e (playwright, windows)
    needs: [changes, e2e-windows-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the e2e run outcome
        shell: bash
        run: |
          gate='${{ needs.changes.result }}'
          run='${{ needs.e2e-windows-run.result }}'
          echo "changes=$gate  e2e run=$run"
          if [ "$gate" != "success" ]; then
            echo "::error::the changes gate concluded '$gate'"; exit 1
          fi
          case "$run" in
            success) echo "e2e passed"; exit 0 ;;
            skipped) echo "no code paths changed — e2e not required for this PR"; exit 0 ;;
            *) echo "::error::e2e run concluded '$run'"; exit 1 ;;
          esac

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --notes "Unsigned builds. macOS: Gatekeeper will warn; Windows: SmartScreen will warn."
