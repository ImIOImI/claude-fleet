name: Publish runner image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'broker/**'
      - '.github/workflows/publish-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Base runner (lean, standalone) ──────────────────────────────────
      - name: Base metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/claude-fleet/runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push base
        id: base
        uses: docker/build-push-action@v5
        with:
          # Repo root is the context so the broker module (//broker/)
          # is reachable from the Dockerfile's multi-stage build.
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── DevOps runner (FROM the base digest we just pushed) ──────────────
      - name: DevOps metadata
        id: meta_devops
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/claude-fleet/runner-devops
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push devops
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/devops/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Pin to the exact base image just built (by digest) so the two
          # images are always in lockstep.
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.owner.outputs.value }}/claude-fleet/runner@${{ steps.base.outputs.digest }}
          tags: ${{ steps.meta_devops.outputs.tags }}
          labels: ${{ steps.meta_devops.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
