[package]
name = "fleet-embedder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Static onnxruntime (download-binaries); rustls so the build needs no OpenSSL headers.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = true
