appId: com.troyknapp.claudefleet
productName: claude-fleet
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# Native modules must live on the real filesystem — they cannot be dlopen'd
# from inside app.asar. Force them (and any *.node binaries) to be unpacked.
# Tray + taskbar-overlay images (#407), loaded at runtime from
# process.resourcesPath/presence (src/main/inbox/presence.ts).
extraResources:
  - from: resources/presence
    to: presence
  # fleet-embedder sidecar (+ app-local VC++ runtime DLLs on Windows), copied
  # here by CI or `make embedder-win`. When absent, semantic search is off.
  - from: embedder/bin
    to: embedder
    filter: ["fleet-embedder", "fleet-embedder.exe", "*.dll"]
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/keytar/**"
  - "**/node_modules/node-pty/**"
# App icon (#407 "Teardrop"); electron-builder derives .ico/.icns from the 1024px PNG.
icon: resources/icon.png
linux:
  target: AppImage
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
