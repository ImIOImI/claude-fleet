appId: com.troyknapp.claudefleet
productName: claude-fleet
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # sharp MUST ship: transformers' CJS node build imports it at module load
  # (pipelines.js -> utils/image.js -> sharp), so excluding it breaks every
  # search_transcripts call in the packaged app with "Cannot find module
  # 'sharp'" (#194 fallout). npm installs only the build platform's @img/*
  # optional packages, so foreign-platform binaries never enter the tree.
# Native modules must live on the real filesystem — they cannot be dlopen'd
# from inside app.asar. Force them (and any *.node binaries) to be unpacked.
# sharp/@img are unpacked as full trees: sharp.node dlopens the libvips
# shared libraries (.dll/.so, not *.node) relative to its own real path.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@huggingface/transformers/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/keytar/**"
  - "**/node_modules/node-pty/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/sharp/**"
linux:
  target: AppImage
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
