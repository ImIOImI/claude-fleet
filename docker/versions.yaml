# Pinned tool versions for the claude-fleet runner images.
#
# qwen: @qwen-code/qwen-code npm package. 0.22.0 is the version pinned at
# implementation time — verify at release (https://www.npmjs.com/package/@qwen-code/qwen-code).
qwen: 0.22.0
#
# Single source of truth for the install scripts in docker/scripts/. The
# devops/dev Dockerfiles set ARG defaults to these values (e.g. gh is shared by
# both); the publish workflow can also read them here to pass --build-arg
# explicitly. Bump deliberately.
#
# Org-canon pins mirror ci-images (SumerSports platform engineering) so an
# expert reviews against the same toolchain CI uses.
gh: 2.87.3            # GitHub CLI
tenv: 4.8.3           # tofu/terraform version manager
tofu: 1.11.5 1.10.5   # OpenTofu versions installed via tenv (first = default)
terramate: 0.17.1     # latest stable; ci-images pins a private 0.17.0-betaNN channel
opa: 1.13.2           # Open Policy Agent
aws_cli: 2.33.27      # AWS CLI v2
azure_cli: 2.83.0     # Azure CLI
doppler: 3.76.0       # Doppler CLI (secrets manager)
argocd: 3.4.5         # Argo CD CLI
argo_workflows: 4.0.7 # Argo Workflows CLI (`argo`)
argo_rollouts: 1.9.0  # Argo Rollouts kubectl plugin

# These track the tool's own latest-release installer (robust, self-updating).
# Set a concrete version here + teach the script to honor it if you need to pin.
yq: latest
tflint: latest
trivy: latest
kubectl: latest       # resolves https://dl.k8s.io/release/stable.txt
kustomize: latest
helm: latest

# Dev image toolchains (docker/dev/Dockerfile).
go: 1.23.5            # Go — official tarball into /usr/local/go
rust: 1.84.0          # Rust — rustup toolchain (cargo/rustc/clippy)
uv: 0.5.14            # uv — fast Python package/venv manager
